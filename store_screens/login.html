<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParkingBuzz Login</title>
<link rel="stylesheet" href="/static/css/style.css">
<style>
body { background: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #fff; margin: 0; padding: 24px 16px; display: flex; flex-direction: column; min-height: 100vh; box-sizing: border-box; }
.card { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 28px 20px; text-align: center; }
.logo-img { width: 110px; height: 110px; margin: 0 auto 16px; display: block; filter: drop-shadow(0 8px 24px rgba(0,0,0,0.5)); }
h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin: 0 0 6px; }
.tagline { color: #94a3b8; font-size: 14px; margin: 0 0 24px; }
.input-group { text-align: left; margin-bottom: 18px; }
label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 8px; }
input { width: 100%; box-sizing: border-box; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 14px 16px; color: #fff; font-size: 15px; outline: none; }
.btn-login { width: 100%; background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: #fff; font-weight: 700; font-size: 16px; padding: 16px; border: none; border-radius: 14px; cursor: pointer; box-shadow: 0 6px 20px rgba(37,99,235,0.4); margin-top: 10px; }
.privacy-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.3); color: #34d399; font-size: 12px; font-weight: 600; padding: 8px 16px; border-radius: 20px; margin-top: 24px; }
</style>
</head>
<body>
  <div style="height: 40px;"></div>
  <div class="card">
    <img src="/static/images/logo.png" class="logo-img" alt="ParkingBuzz">
    <h1>ParkingBuzz</h1>
    <p class="tagline">Smart QR Vehicle Tag & Instant Alerts</p>
    
    <div class="input-group">
      <label>Windshield Sticker Tag ID</label>
      <input type="text" value="BUZZ-7821" readonly>
    </div>
    
    <div class="input-group">
      <label>Vehicle Name (e.g. Model / Nickname)</label>
      <input type="text" value="Family Sedan (2026)" readonly>
    </div>
    
    <button class="btn-login">🚀 Connect Tag & Open Dashboard</button>
    
    <div>
      <div class="privacy-badge">
        <span>🛡️</span> 100% Privacy Protected • Phone Number Masked
      </div>
    </div>
  </div>
</body>
</html>
