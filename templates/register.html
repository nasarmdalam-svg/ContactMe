<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Your Vehicle - ParkingBuzz</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="manifest" href="/static/manifest.json">
</head>
<body>
  <div class="container" style="max-width: 460px;">
    <!-- Top Brand Header (First Screen - No Back Button) -->
    <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 16px;">
      <span style="font-size: 11px; color: #64748b; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; background: rgba(255,255,255,0.04); padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.08);">PARKINGBUZZ OFFICIAL</span>
    </div>

    <div class="header" style="margin-bottom: 14px;">
      <img src="/static/images/official_chrome_p_badge.png" alt="ParkingBuzz" style="width: 64px; height: 64px; border-radius: 50%; object-fit: contain; filter: drop-shadow(0 4px 16px rgba(56, 189, 248, 0.45)); margin-bottom: 8px;">
      <h1 style="font-size: 20px; font-weight: 800; margin-bottom: 3px;">Welcome to ParkingBuzz</h1>
      <p style="color: var(--text-secondary); font-size: 13px; margin: 0;">Instant QR parking alerts & private contact for your vehicle.</p>
    </div>

    <div class="privacy-banner" style="background: rgba(56, 189, 248, 0.08); border-color: rgba(56, 189, 248, 0.25); padding: 8px 12px; margin-bottom: 14px; gap: 8px;">
      <span style="font-size: 16px;">🛡️</span>
      <span style="font-size: 12px; line-height: 1.35;">100% Privacy Protected: Alerts & calls are routed without exposing your phone number.</span>
    </div>

    <div style="display: flex; gap: 8px; margin-bottom: 16px; background: rgba(255,255,255,0.04); padding: 4px; border-radius: 12px; border: 1px solid var(--border-color);">
      <button type="button" id="tabNew" style="flex: 1; padding: 10px; border-radius: 9px; border: none; background: #38bdf8; color: #0f172a; font-weight: 700; font-size: 13px; cursor: pointer; transition: all 0.2s;">
        🚗 Generate New Sticker
      </button>
      <button type="button" id="tabExisting" style="flex: 1; padding: 10px; border-radius: 9px; border: none; background: transparent; color: #94a3b8; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s;">
        🏷️ Link Printed Sticker
      </button>
    </div>

    <form id="registerForm">
      <div id="existingTagGroup" style="display: none; margin-bottom: 16px;">
        <label style="display:block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #38bdf8;">
          Sticker ID (Printed on your card) <span style="color: #ef4444;">*</span>
        </label>
        <input type="text" id="existingTagId" placeholder="e.g. BUZZ-970927 or CAR-123456" style="width: 100%; box-sizing: border-box; padding: 12px; background: rgba(56, 189, 248, 0.08); border: 1px solid #38bdf8; border-radius: 10px; color: white; font-size: 15px; font-weight: 600; text-transform: uppercase;">
        <span style="font-size: 11px; color: var(--text-secondary); display: block; margin-top: 4px;">Enter the Tag ID printed at the bottom of your physical sticker.</span>
      </div>

      <div style="margin-bottom: 16px;">
        <label style="display:block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #f1f5f9;">
          Vehicle Number Plate / Name <span style="color: #ef4444;">*</span>
        </label>
        <input type="text" id="vehicleName" placeholder="e.g. DL 01 AB 1234 or Black SUV" required style="width: 100%; box-sizing: border-box; padding: 12px; background: rgba(255,255,255,0.06); border: 1px solid var(--border-color); border-radius: 10px; color: white; font-size: 15px;">
      </div>

      <div style="margin-bottom: 16px;">
        <label style="display:block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #f1f5f9;">
          Your Name / Display Name (Optional)
        </label>
        <input type="text" id="ownerName" placeholder="e.g. Vehicle Owner" style="width: 100%; box-sizing: border-box; padding: 12px; background: rgba(255,255,255,0.06); border: 1px solid var(--border-color); border-radius: 10px; color: white; font-size: 15px;">
      </div>



      <!-- Privacy Policy Checkbox -->
      <div style="margin-bottom: 22px; display: flex; align-items: flex-start; gap: 10px; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 10px; border: 1px solid var(--border-color);">
        <input type="checkbox" id="agreePrivacy" required style="margin-top: 3px; cursor: pointer; width: 18px; height: 18px; accent-color: #38bdf8;">
        <label for="agreePrivacy" style="font-size: 13px; color: var(--text-secondary); cursor: pointer; line-height: 1.4;">
          I agree to the <a href="/privacy" target="_blank" style="color: #38bdf8; text-decoration: underline; font-weight: 600;">ParkingBuzz Privacy Policy</a> and consent to receiving vehicle safety alerts.
        </label>
      </div>

      <button type="submit" id="btnSubmit" class="btn-primary" style="background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%); font-weight: 700; padding: 14px; font-size: 15px;">
        ⚡ Generate My Vehicle Tag & Sticker
      </button>
    </form>

    <div id="statusToast" style="display:none; margin-top: 15px; padding: 12px; border-radius: 8px; text-align: center; font-size: 14px;"></div>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const toast = document.getElementById('statusToast');
    const btnSubmit = document.getElementById('btnSubmit');
    const tabNew = document.getElementById('tabNew');
    const tabExisting = document.getElementById('tabExisting');
    const existingTagGroup = document.getElementById('existingTagGroup');
    const existingTagIdInput = document.getElementById('existingTagId');

    let currentMode = 'new'; // 'new' or 'existing'

    tabNew.addEventListener('click', () => {
      currentMode = 'new';
      tabNew.style.background = '#38bdf8';
      tabNew.style.color = '#0f172a';
      tabExisting.style.background = 'transparent';
      tabExisting.style.color = '#94a3b8';
      existingTagGroup.style.display = 'none';
      existingTagIdInput.required = false;
      btnSubmit.textContent = '⚡ Generate My Vehicle Tag & Sticker';
    });

    tabExisting.addEventListener('click', () => {
      currentMode = 'existing';
      tabExisting.style.background = '#38bdf8';
      tabExisting.style.color = '#0f172a';
      tabNew.style.background = 'transparent';
      tabNew.style.color = '#94a3b8';
      existingTagGroup.style.display = 'block';
      existingTagIdInput.required = true;
      existingTagIdInput.focus();
      btnSubmit.textContent = '🔗 Link Sticker to My Vehicle';
    });



    // Auto-select tab if URL has ?mode=link
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('mode') === 'link') {
      tabExisting.click();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const vehicleName = document.getElementById('vehicleName').value.trim();
      const ownerName = document.getElementById('ownerName').value.trim();
      const customNote = '';
      const agree = document.getElementById('agreePrivacy').checked;

      if (!agree) {
        alert('Please agree to the Privacy Policy to proceed.');
        return;
      }

      btnSubmit.disabled = true;

      if (currentMode === 'existing') {
        const inputTag = existingTagIdInput.value.trim().toUpperCase();
        if (!inputTag) {
          alert('Please enter your physical Sticker ID.');
          btnSubmit.disabled = false;
          return;
        }

        btnSubmit.textContent = 'Linking your sticker...';
        try {
          const resp = await fetch(`/api/activate/${inputTag}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ vehicle_name: vehicleName, custom_note: customNote })
          });
          const data = await resp.json();
          if (resp.ok) {
            localStorage.setItem('pb_active_tag', inputTag);
            if (window.ParkBuzzApp && typeof window.ParkBuzzApp.onTagLoaded === 'function') {
              window.ParkBuzzApp.onTagLoaded(inputTag);
            }
            toast.textContent = 'Sticker linked! Opening your dashboard...';
            toast.style.display = 'block';
            toast.style.background = 'rgba(16, 185, 129, 0.2)';
            toast.style.color = '#34d399';
            setTimeout(() => {
              window.location.href = `/owner/${inputTag}`;
            }, 800);
          } else {
            toast.textContent = data.detail || 'Failed to link sticker';
            toast.style.display = 'block';
            toast.style.background = 'rgba(239, 68, 68, 0.2)';
            toast.style.color = '#f87171';
            btnSubmit.disabled = false;
            btnSubmit.textContent = '🔗 Link Sticker to My Vehicle';
          }
        } catch (err) {
          alert('Error connecting to server: ' + err.message);
          btnSubmit.disabled = false;
          btnSubmit.textContent = '🔗 Link Sticker to My Vehicle';
        }
      } else {
        btnSubmit.textContent = 'Generating vehicle tag...';
        try {
          const resp = await fetch('/api/register-vehicle', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ vehicle_name: vehicleName, owner_name: ownerName, custom_note: customNote })
          });
          const data = await resp.json();
          if (resp.ok && data.tag_id) {
            const newTagId = data.tag_id;
            localStorage.setItem('pb_active_tag', newTagId);

            if (window.ParkBuzzApp && typeof window.ParkBuzzApp.onTagLoaded === 'function') {
              window.ParkBuzzApp.onTagLoaded(newTagId);
            }

            toast.textContent = 'Tag generated! Opening your dashboard...';
            toast.style.display = 'block';
            toast.style.background = 'rgba(16, 185, 129, 0.2)';
            toast.style.color = '#34d399';
            setTimeout(() => {
              window.location.href = `/owner/${newTagId}`;
            }, 800);
          } else {
            toast.textContent = data.detail || 'Registration failed';
            toast.style.display = 'block';
            toast.style.background = 'rgba(239, 68, 68, 0.2)';
            toast.style.color = '#f87171';
            btnSubmit.disabled = false;
            btnSubmit.textContent = '⚡ Generate My Vehicle Tag & Sticker';
          }
        } catch (err) {
          alert('Error connecting to server: ' + err.message);
          btnSubmit.disabled = false;
          btnSubmit.textContent = '⚡ Generate My Vehicle Tag & Sticker';
        }
      }
    });
  </script>
</body>
</html>
