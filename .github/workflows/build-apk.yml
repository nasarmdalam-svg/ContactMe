name: Build ParkBuzz Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK on GitHub Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Named APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/ParkBuzz-v2.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParkBuzz-v2.1-APK
          path: android/app/build/outputs/apk/debug/ParkBuzz-v2.1.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.1
          name: ParkBuzz Android App v2.1
          body: |
            ## ⚡ ParkBuzz v2.1 — Colorful Logo & Silent Isolated Background Process
            - **No Battery Optimization Popups:** Removed all confusing battery optimization prompts and system screens.
            - **Isolated Background Process (`:alert_service`):** Service runs in an independent Linux process that remains alive even when the user swipes away the app from recent apps.
            - **Colorful ParkBuzz App Logo:** Displays the colorful app icon on the launch screen and in notifications.
            - **Clean Launch Screen:** Replaced text with simple, elegant "Please wait..." and official branding.
            - **Seamless 1-Tap Upgrade:** Signed with the permanent keystore so users update directly without uninstalling.
          files: |
            android/app/build/outputs/apk/debug/ParkBuzz-v2.1.apk
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
