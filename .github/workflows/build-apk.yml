name: Build ParkBuzz Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK on GitHub Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Named APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/ParkBuzz-v1.7.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParkBuzz-v1.7-APK
          path: android/app/build/outputs/apk/debug/ParkBuzz-v1.7.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.7
          name: ParkBuzz Android App v1.7
          body: |
            ## ⚡ ParkBuzz v1.7
            - **Incoming Voice Call Accept/Decline:** Screen pop-up now differentiates voice calls, offering `Accept Call` to talk live and `Decline` to decline.
            - **Mandatory Vehicle Setup Gate:** Requires vehicle number plate or model before activating sticker so scanners know which vehicle they are contacting.
            - **Clear Alerts History:** Added `Clear` button to easily wipe old alert history logs anytime.
            - **Silent Background & Clean Chime:** Zero status bar icons in background, and single clean car chime audio.
          files: |
            android/app/build/outputs/apk/debug/ParkBuzz-v1.7.apk
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
