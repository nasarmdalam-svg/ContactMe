name: Build ParkBuzz Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK on GitHub Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Named APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/ParkBuzz-v1.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParkBuzz-v1.1-APK
          path: android/app/build/outputs/apk/debug/ParkBuzz-v1.1.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1
          name: ParkBuzz Android App v1.1
          body: |
            ## ⚡ ParkBuzz v1.1
            - **Silent Background Execution:** No persistent notification bar clutter. The app runs completely silently in the background.
            - **Instant Screen Pop-up:** On emergency alert, turns on screen, displays heads-up pop-up alert, and plays loud alarm siren.
            - **Profile Editing:** Easily edit vehicle plate, owner name, and bystander note directly from the dashboard.
          files: |
            android/app/build/outputs/apk/debug/ParkBuzz-v1.1.apk
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
