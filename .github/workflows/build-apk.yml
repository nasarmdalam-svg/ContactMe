name: Build ParkBuzz Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK on GitHub Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Named APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/ParkBuzz-v2.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParkBuzz-v2.0-APK
          path: android/app/build/outputs/apk/debug/ParkBuzz-v2.0.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0
          name: ParkBuzz Android App v2.0
          body: |
            ## ⚡ ParkBuzz v2.0 — Unrestricted Background Protection & Official App Icon
            - **No Blank Notification Box:** Replaced solid square with official crisp ParkBuzz monochrome stencil vector icon (`ic_stat_parkbuzz`) in status bar, and vibrant full-color app logo in notification shade.
            - **Unrestricted Background Activity:** Prompts for Battery Optimization exemption at install so Android OS never kills or suspends the background service when the app is swiped away.
            - **Never Terminate on Task Removal:** Added `android:stopWithTask="false"` and `BootReceiver` auto-restart mechanism.
            - **Survives Device Reboot:** Automatically resumes monitoring after phone restarts or app updates (`RECEIVE_BOOT_COMPLETED`).
            - **Top Status Bar Clean:** Zero icon when idle; only displays the official ParkBuzz icon when an actual parking alert or call arrives.
            - **Seamless 1-Tap Upgrade:** Signed with the permanent keystore so users update directly without uninstalling.
          files: |
            android/app/build/outputs/apk/debug/ParkBuzz-v2.0.apk
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
