name: Build ParkBuzz Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK on GitHub Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Named APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/ParkBuzz-v1.2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParkBuzz-v1.2-APK
          path: android/app/build/outputs/apk/debug/ParkBuzz-v1.2.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2
          name: ParkBuzz Android App v1.2
          body: |
            ## ⚡ ParkBuzz v1.2
            - **Closed-App Delivery:** Low-priority keeper keeps WebSocket alive so you receive notifications even when closed.
            - **No Harsh Siren:** Completely removed harsh siren sound; only the clean synthesized chime alert plays.
            - **Heads-up Screen Pop-up:** Turns on screen and pops up directly with silence/action buttons.
            - **Profile Editing:** Edit vehicle plate, owner name, and bystander note on the fly.
          files: |
            android/app/build/outputs/apk/debug/ParkBuzz-v1.2.apk
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
