name: Build ParkBuzz Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK on GitHub Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Named APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/ParkBuzz-v1.4.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParkBuzz-v1.4-APK
          path: android/app/build/outputs/apk/debug/ParkBuzz-v1.4.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.4
          name: ParkBuzz Android App v1.4
          body: |
            ## ⚡ ParkBuzz v1.4
            - **Single Audio Sound Fix:** Packaged clean dual-tone car horn chime (`res/raw/chime.wav`) directly inside the APK. Eliminated duplicate siren and overlapping sounds.
            - **Closed-App Background Alert:** Native foreground service with auto-restart and Android 14+ remote messaging support so alerts chime even when closed.
            - **Active / Disconnect Toggle:** Easily toggle status between Online (Active) and Disconnected (Snoozed) right from the top of the owner dashboard.
            - **Owner & Vehicle Profile Editor:** Edit vehicle registration, owner name, and parking notes on the fly.
            - **Screen Pop-Up:** Fullscreen heads-up dialog pops up immediately on alert arrival.
          files: |
            android/app/build/outputs/apk/debug/ParkBuzz-v1.4.apk
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
