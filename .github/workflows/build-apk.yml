name: Build ParkBuzz Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK on GitHub Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Named APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/ParkBuzz-v1.9.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParkBuzz-v1.9-APK
          path: android/app/build/outputs/apk/debug/ParkBuzz-v1.9.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.9
          name: ParkBuzz Android App v1.9
          body: |
            ## ⚡ ParkBuzz v1.9
            - **Status Bar Clean:** Suppressed all icons from the top status bar (battery/clock area). Zero persistent notification clutter.
            - **Closed-App Alerts & Calls Restored:** Real-time dual-tone chime sound and heads-up pop-up alert when app is closed or phone is locked.
            - **24/7 Keep-Alive Engine:** Added automatic 10-minute ping cron workflow preventing Render free instance from sleeping.
            - **Branded Splash & Loading Shield:** Beautiful native ParkBuzz loading screen guarantees users never see Render spin-up or blank pages.
            - **Active Call Disconnect Button:** Prominent red disconnect button both in native Android alert dialog and web overlay.
            - **Seamless 1-Tap Upgrade:** Signed with the permanent keystore so users update directly without uninstalling.
          files: |
            android/app/build/outputs/apk/debug/ParkBuzz-v1.9.apk
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
