<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — ParkingBuzz Control Center</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body {
      background: radial-gradient(circle at 50% 0%, #131d33 0%, #080c14 100%) !important;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .login-box {
      width: 100%;
      max-width: 400px;
      background: rgba(18, 25, 42, 0.95);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(16px);
      text-align: center;
    }
    .admin-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 18px;
    }
    .input-field {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 16px;
      background: rgba(10, 16, 28, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: white;
      font-size: 16px;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-field:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }
    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
      color: #040812;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.35);
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn-login:active {
      transform: scale(0.98);
    }
    .error-msg {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="admin-badge">PARKINGBUZZ SECURE GATEWAY</div>
    
    <img src="/static/images/official_chrome_p_badge.png" alt="ParkingBuzz" style="width: 72px; height: 72px; border-radius: 50%; object-fit: contain; filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.5)); margin-bottom: 12px;">
    
    <h1 style="font-size: 22px; font-weight: 800; color: #f8fafc; margin-bottom: 6px;">Admin Control Center</h1>
    <p style="font-size: 13px; color: #94a3b8; margin-bottom: 24px;">Enter your master administrator key to manage vehicles, approvals, and security alerts.</p>

    {% if error %}
      <div class="error-msg">⚠️ {{ error }}</div>
    {% endif %}

    <form action="/admin/login" method="POST">
      <div style="position: relative; text-align: left;">
        <label style="display: block; font-size: 12px; font-weight: 700; color: #cbd5e1; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;">Master Key</label>
        <input type="password" id="adminPassword" name="password" required placeholder="Enter admin password" class="input-field" autofocus>
      </div>

      <button type="submit" class="btn-login">
        ⚡ Unlock Control Center
      </button>
    </form>

    <div style="margin-top: 24px; font-size: 12px; color: #64748b;">
      256-bit encrypted server verification · Strict session token
    </div>
  </div>

</body>
</html>
