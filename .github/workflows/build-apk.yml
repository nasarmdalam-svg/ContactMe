name: Build ParkBuzz Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK on GitHub Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Named APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/ParkBuzz-v1.8.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParkBuzz-v1.8-APK
          path: android/app/build/outputs/apk/debug/ParkBuzz-v1.8.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.8
          name: ParkBuzz Android App v1.8
          body: |
            ## ⚡ ParkBuzz v1.8
            - **Closed-App Alerts Restored:** Service upgraded to LOW importance with partial wake lock so Android 14/15 keeps the background connection alive 24/7 even when phone is locked or app is closed.
            - **Active Call Disconnect Screen:** When owner accepts a call, a clear persistent dialog with a prominent red "🔴 Disconnect / End Call" button is displayed to easily end the call.
            - **Silent Foreground Service:** Zero sound, vibration, or peeking notifications from the background monitoring service.
            - **Seamless 1-Tap Upgrade:** Signed with the permanent keystore so users update directly without uninstalling.
          files: |
            android/app/build/outputs/apk/debug/ParkBuzz-v1.8.apk
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
