name: Build ParkBuzz Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK on GitHub Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Named APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/ParkBuzz-v1.5.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParkBuzz-v1.5-APK
          path: android/app/build/outputs/apk/debug/ParkBuzz-v1.5.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.5
          name: ParkBuzz Android App v1.5
          body: |
            ## ⚡ ParkBuzz v1.5
            - **Download Printable Sticker Fix:** Integrated Android native DownloadListener to save printable sticker PNG directly to device Downloads folder.
            - **Edit Details & Active/Inactive Switch:** Fixed JavaScript syntax issue in dashboard so editing vehicle/owner info and toggling Active/Inactive works immediately on tap.
            - **One-Card Permission Setup:** Single calm setup card on first open (notifications, background activity, microphone) without shocking the user with multiple popups.
            - **Permanent Signing Keystore:** App is signed with a permanent release key — future updates install cleanly in 1 tap without uninstalling.
            - **Single Clean Embedded Sound:** Packaged chime audio directly in APK without duplicate sirens.
          files: |
            android/app/build/outputs/apk/debug/ParkBuzz-v1.5.apk
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
