<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Contact Vehicle Owner — ParkingBuzz</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="manifest" href="/static/manifest.json">
  <style>
    :root {
      --bg-dark: #070b14;
      --card-bg: rgba(15, 23, 42, 0.78);
      --card-border: rgba(255, 255, 255, 0.08);
      --cyan: #38bdf8;
      --emerald: #10b981;
      --amber: #fbbf24;
      --rose: #f87171;
    }

    body {
      background: radial-gradient(circle at top, #0f172a 0%, #070b14 100%) !important;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      display: block !important;
      width: 100% !important;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .bystander-wrap {
      max-width: 440px;
      margin: 0 auto;
      padding: 20px 16px 44px 16px;
      box-sizing: border-box;
    }

    .glass-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 16px 18px;
      margin-bottom: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }

    /* Primary Voice Call Button */
    .call-btn {
      width: 100%;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      border: none;
      border-radius: 18px;
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.35);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .call-btn:active {
      transform: scale(0.98);
      filter: brightness(0.92);
    }

    /* Alert Cards */
    .alerts-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .alert-card {
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 13px 15px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
      width: 100%;
      box-sizing: border-box;
    }

    .alert-card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(56, 189, 248, 0.3);
    }

    .alert-card:active {
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.5);
      transform: scale(0.99);
    }

    .alert-card .icon-box {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .alert-card .alert-content {
      flex: 1;
    }

    .alert-card .alert-title {
      font-size: 14px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 2px;
    }

    .alert-card .alert-desc {
      font-size: 11px;
      color: #94a3b8;
    }

    .alert-card .alert-arrow {
      color: #64748b;
      font-size: 14px;
      font-weight: 700;
    }

    /* Location Toggle Pill */
    .loc-toggle-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 11px 15px;
      margin-bottom: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .loc-toggle-card:active {
      background: rgba(255, 255, 255, 0.05);
    }

    .switch-track {
      width: 42px;
      height: 24px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      position: relative;
      transition: background 0.25s ease;
      flex-shrink: 0;
    }

    .switch-track.active {
      background: #10b981;
    }

    .switch-thumb {
      width: 18px;
      height: 18px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 3px;
      left: 3px;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }

    .switch-track.active .switch-thumb {
      transform: translateX(18px);
    }

    /* Quick Note Chips */
    .quick-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      color: #cbd5e1;
      padding: 5px 11px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .quick-chip:active {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
      color: #38bdf8;
    }

    /* Dedicated Call Overlay */
    .call-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #0f172a 0%, #030712 100%);
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      box-sizing: border-box;
    }

    .call-overlay.active {
      display: flex;
    }

    .pulse-ring {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 46px;
      box-shadow: 0 0 40px rgba(16, 185, 129, 0.4);
      animation: pulse 1.8s infinite ease-in-out;
      margin-bottom: 24px;
    }

    @keyframes pulse {
      0% { transform: scale(0.96); box-shadow: 0 0 20px rgba(16, 185, 129, 0.3); }
      50% { transform: scale(1.08); box-shadow: 0 0 50px rgba(16, 185, 129, 0.6); }
      100% { transform: scale(0.96); box-shadow: 0 0 20px rgba(16, 185, 129, 0.3); }
    }

    .btn-end {
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 999px;
      padding: 16px 44px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(239, 68, 68, 0.4);
      margin-top: 30px;
    /* Executive Dark Frosted HUD Toast (No Big Green Oval) */
    .toast-pill {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-12px);
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      color: #f8fafc;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.06);
      z-index: 10000;
      display: none;
      align-items: center;
      gap: 8px;
      text-align: center;
      white-space: nowrap;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      opacity: 0;
    }
    .toast-pill.active {
      display: inline-flex;
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast-pill.error {
      border-color: rgba(239, 68, 68, 0.5);
      color: #fca5a5;
    }
</head>
<body>
  <div class="bystander-wrap">

    <!-- Top Luxury Header -->
    <div style="text-align: center; margin-bottom: 18px;">
      <img src="/static/images/official_chrome_p_badge.png" alt="ParkingBuzz" style="width: 64px; height: 64px; border-radius: 50%; object-fit: contain; filter: drop-shadow(0 4px 18px rgba(56, 189, 248, 0.45)); margin-bottom: 8px;">
      <div style="font-size: 11px; font-weight: 800; color: #38bdf8; letter-spacing: 1.5px; text-transform: uppercase;">
        PARKINGBUZZ CONNECT
      </div>
      <h1 style="font-size: 22px; font-weight: 900; color: #f8fafc; margin: 4px 0 2px 0;">
        Contact Vehicle Owner
      </h1>
      <div style="display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; background: rgba(255, 255, 255, 0.05); padding: 5px 14px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1);">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #10b981; box-shadow: 0 0 8px #10b981;"></span>
        <strong style="color: #f1f5f9; font-size: 13px;">{{ tag.vehicle_name if tag.vehicle_name else 'Vehicle' }}</strong>
        <span style="opacity: 0.3;">|</span>
        <span style="color: #38bdf8; font-weight: 700; font-size: 12px;">{{ tag.tag_id }}</span>
      </div>
    </div>

    <!-- 100% Privacy Shield Banner -->
    <div style="background: rgba(16, 185, 129, 0.07); border: 1px solid rgba(16, 185, 129, 0.25); border-radius: 14px; padding: 11px 14px; margin-bottom: 14px; display: flex; align-items: center; gap: 12px;">
      <span style="font-size: 20px;">🛡️</span>
      <div style="font-size: 12px; color: #cbd5e1; line-height: 1.4;">
        <strong style="color: #34d399;">100% Private Contact:</strong> Your phone number is never revealed. Calls and alerts route securely to the owner.
      </div>
    </div>

    <!-- Emergency Medical Info (if configured by owner) -->
    {% if tag.get('blood_group') or tag.get('emergency_contact') or tag.get('emergency_phone') %}
    <div style="background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.25); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px;">
      <div style="display: flex; align-items: center; justify-content: space-between; cursor: pointer;" onclick="const d = document.getElementById('medBox'); d.style.display = d.style.display === 'none' ? 'block' : 'none';">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 18px;">🛡️</span>
          <strong style="color: #f87171; font-size: 13px;">Emergency / Medical ICE Profile</strong>
        </div>
        <span style="font-size: 10px; color: #f87171; font-weight: 800; background: rgba(239, 68, 68, 0.15); padding: 3px 8px; border-radius: 6px;">VIEW ▼</span>
      </div>
      <div id="medBox" style="display: none; margin-top: 10px; font-size: 13px; color: #f1f5f9; border-top: 1px dashed rgba(239, 68, 68, 0.3); padding-top: 10px;">
        {% if tag.get('blood_group') %}
        <div style="margin-bottom: 6px;">🩸 Blood Group: <strong style="color: #ef4444;">{{ tag.blood_group }}</strong></div>
        {% endif %}
        {% if tag.get('emergency_contact') %}
        <div style="margin-bottom: 6px;">👤 ICE Contact: <strong>{{ tag.emergency_contact }}</strong></div>
        {% endif %}
        {% if tag.get('emergency_phone') %}
        <a href="tel:{{ tag.emergency_phone }}" style="display: inline-flex; align-items: center; gap: 6px; background: #ef4444; color: white; padding: 9px 16px; border-radius: 10px; text-decoration: none; font-size: 13px; font-weight: 800; margin-top: 6px;">
          📞 Call Emergency ICE Contact
        </a>
        {% endif %}
      </div>
    </div>
    {% endif %}

    <!-- Real-time Owner Response Card (Executive Metallic & Emerald Glow) -->
    <div id="ownerResponseBanner" style="display: none; margin-bottom: 18px; animation: slideDownReply 0.35s cubic-bezier(0.16, 1, 0.3, 1);">
      <div style="background: linear-gradient(135deg, rgba(30, 41, 59, 0.95) 0%, rgba(15, 23, 42, 0.98) 100%); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 16px; padding: 14px 18px; box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.12); position: relative; overflow: hidden; text-align: left;">
        <!-- Top ambient neon accent line -->
        <div style="position: absolute; top: 0; left: 10%; right: 10%; height: 2px; background: linear-gradient(90deg, transparent, #38bdf8, #10b981, transparent);"></div>
        
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 10px #34d399;"></span>
            <span style="color: #38bdf8; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.2px;">Owner Responded Live</span>
          </div>
          <span style="font-size: 10px; color: #94a3b8; font-weight: 600; background: rgba(255, 255, 255, 0.06); padding: 2px 8px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.08);">LIVE</span>
        </div>

        <div style="background: rgba(0, 0, 0, 0.35); border-left: 3px solid #34d399; border-radius: 8px; padding: 10px 14px;">
          <div id="ownerResponseText" style="color: #ffffff; font-size: 15px; font-weight: 800; letter-spacing: 0.2px; line-height: 1.4;"></div>
        </div>
      </div>
    </div>

    <!-- Anti-Spam Cooldown Notice -->
    <div id="cooldownNotice" style="display: none; background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; font-size: 12px; font-weight: 700; color: #38bdf8; text-align: center;">
      ⏳ Buttons temporarily locked (10s) to prevent spamming...
    </div>

    <!-- Primary Action: Free Private Voice Call (Always Open & Unrestricted) -->
    <div style="margin-bottom: 16px;">
      <button class="call-btn" id="btnStartCall">
        <span style="font-size: 22px;">📞</span>
        <span>Call Owner (Private Voice Call)</span>
      </button>
      <div style="display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 11px; color: #64748b; margin-top: 8px;">
        <span>🔒</span> Masked WebRTC Call • Zero Phone Numbers Exchanged
      </div>
    </div>

    <!-- Location Toggle: DEFAULT OFF (User can tap to enable) -->
    <div class="loc-toggle-card" onclick="toggleLocationSwitch()">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="font-size: 18px;">📍</span>
        <div>
          <div style="font-size: 12px; font-weight: 700; color: #f1f5f9;">Share Approximate Location</div>
          <div id="locStatusText" style="font-size: 11px; color: #64748b;">Disabled (Tap to turn on)</div>
        </div>
      </div>
      <div id="locToggleTrack" class="switch-track">
        <div class="switch-thumb"></div>
      </div>
      <input type="checkbox" id="attachLocation" style="display: none;">
    </div>

    <!-- Quick Alerts Grid -->
    <div class="glass-panel">
      <div style="font-size: 12px; font-weight: 800; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between;">
        <span>⚡ Instant Vehicle Alerts</span>
        <span style="font-size: 10px; color: #64748b; font-weight: 600;">TAP TO NOTIFY</span>
      </div>

      <div class="alerts-grid">
        <button type="button" class="alert-card" data-type="blocking" data-text="Car is blocking someone / driveway">
          <div class="icon-box" style="background: rgba(239, 68, 68, 0.12); color: #f87171;">🚗</div>
          <div class="alert-content">
            <div class="alert-title">Car is Blocking Driveway / Exit</div>
            <div class="alert-desc">Send immediate chime to move vehicle</div>
          </div>
          <span class="alert-arrow">→</span>
        </button>

        <button type="button" class="alert-card" data-type="lights" data-text="Headlights or hazard lights left ON">
          <div class="icon-box" style="background: rgba(245, 158, 11, 0.12); color: #fbbf24;">💡</div>
          <div class="alert-content">
            <div class="alert-title">Headlights / Hazard Lights ON</div>
            <div class="alert-desc">Prevent car battery from draining</div>
          </div>
          <span class="alert-arrow">→</span>
        </button>

        <button type="button" class="alert-card" data-type="alarm" data-text="Car alarm is going off">
          <div class="icon-box" style="background: rgba(239, 68, 68, 0.12); color: #f87171;">🚨</div>
          <div class="alert-content">
            <div class="alert-title">Car Security Alarm Sounding</div>
            <div class="alert-desc">Notify owner of loud siren sounding</div>
          </div>
          <span class="alert-arrow">→</span>
        </button>

        <button type="button" class="alert-card" data-type="window" data-text="Window is left open / rolled down">
          <div class="icon-box" style="background: rgba(56, 189, 248, 0.12); color: #38bdf8;">🪟</div>
          <div class="alert-content">
            <div class="alert-title">Window Left Open</div>
            <div class="alert-desc">Protect against sudden rain or theft</div>
          </div>
          <span class="alert-arrow">→</span>
        </button>

        <button type="button" class="alert-card" data-type="emergency" data-text="Towing warning / Emergency">
          <div class="icon-box" style="background: rgba(239, 68, 68, 0.18); color: #ef4444;">⚠️</div>
          <div class="alert-content">
            <div class="alert-title" style="color: #f87171;">Towing / Urgent Emergency</div>
            <div class="alert-desc">Critical warning to move immediately</div>
          </div>
          <span class="alert-arrow">→</span>
        </button>
      </div>
    </div>

    <!-- Custom Message Box with Quick Chips -->
    <div class="glass-panel">
      <div style="font-size: 12px; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px;">
        ✉️ Custom Note to Owner
      </div>

      <!-- Quick Note Suggestion Chips -->
      <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px;">
        <span class="quick-chip" onclick="fillCustomNote('Need to leave in 5 mins, please move.')">Need to leave in 5m</span>
        <span class="quick-chip" onclick="fillCustomNote('Parked too close, cannot open door.')">Cannot open door</span>
        <span class="quick-chip" onclick="fillCustomNote('Gate is being closed shortly.')">Gate closing soon</span>
      </div>

      <textarea id="customMessage" rows="2" placeholder="Type a specific message for the vehicle owner..." style="width: 100%; box-sizing: border-box; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; color: white; font-size: 13px; margin-bottom: 10px; resize: none; outline: none;"></textarea>
      
      <button type="button" id="btnSendCustom" style="width: 100%; background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.35); color: #38bdf8; font-weight: 800; padding: 12px; border-radius: 12px; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s;">
        <span>✉️ Send Note to Owner</span>
      </button>
    </div>

    <!-- Footer -->
    <div style="text-align: center; font-size: 11px; color: #475569; margin-top: 22px;">
      Protected by ParkingBuzz • Instant QR Vehicle Contact Network
    </div>

  </div>

  <!-- Dedicated In-Call Overlay -->
  <div class="call-overlay" id="callOverlay">
    <div class="pulse-ring">📞</div>
    <div id="callStatusText" style="font-size: 20px; font-weight: 800; color: #f8fafc; margin-bottom: 6px;">
      Calling Owner...
    </div>
    <div id="callSubText" style="font-size: 13px; color: #94a3b8; text-align: center; max-width: 280px; line-height: 1.4;">
      Owner's phone is ringing. Please stay on this screen.
    </div>

    <div id="callDuration" style="font-size: 16px; font-weight: 700; color: #34d399; margin-top: 14px; display: none;">
      00:00
    </div>

    <button type="button" class="btn-end" id="btnEndCall">
      <span>🔴 End Call</span>
    </button>
  </div>

  <!-- Status Toast Pill -->
  <div class="toast-pill" id="statusToast"></div>

  <audio id="remoteAudio" autoplay playsinline></audio>

  <script src="/static/js/sound.js"></script>
  <script src="/static/js/webrtc.js"></script>
  <script>
    const tagId = "{{ tag.tag_id }}";
    const statusToast = document.getElementById('statusToast');
    const callOverlay = document.getElementById('callOverlay');
    const callStatusText = document.getElementById('callStatusText');
    const callSubText = document.getElementById('callSubText');
    const callDuration = document.getElementById('callDuration');
    const remoteAudio = document.getElementById('remoteAudio');

    let toastTimer = null;
    function showToast(text, isError = false) {
      if (toastTimer) clearTimeout(toastTimer);
      statusToast.textContent = text;
      statusToast.className = 'toast-pill active' + (isError ? ' error' : '');
      toastTimer = setTimeout(() => {
        statusToast.className = 'toast-pill';
      }, 3000);
    }

    // Location Toggle (DEFAULT OFF)
    function toggleLocationSwitch() {
      const checkbox = document.getElementById('attachLocation');
      const track = document.getElementById('locToggleTrack');
      const statusText = document.getElementById('locStatusText');
      if (!checkbox) return;
      checkbox.checked = !checkbox.checked;
      if (checkbox.checked) {
        track.classList.add('active');
        statusText.textContent = 'Enabled (Sharing approximate location)';
        statusText.style.color = '#34d399';
        showToast('📍 Approximate location will be attached to alert');
      } else {
        track.classList.remove('active');
        statusText.textContent = 'Disabled (Tap to turn on)';
        statusText.style.color = '#64748b';
      }
    }

    function fillCustomNote(text) {
      const el = document.getElementById('customMessage');
      if (el) {
        el.value = text;
        el.focus();
      }
    }

    async function getApproxLocation() {
      const attachLoc = document.getElementById('attachLocation');
      if (!attachLoc || !attachLoc.checked || !navigator.geolocation) return null;
      return new Promise((resolve) => {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const lat = pos.coords.latitude.toFixed(5);
            const lng = pos.coords.longitude.toFixed(5);
            resolve(`https://maps.google.com/?q=${lat},${lng}`);
          },
          () => resolve(null),
          { timeout: 2500, maximumAge: 60000 }
        );
      });
    }

    function startAlertCooldown(seconds = 10) {
      const cards = document.querySelectorAll('.alert-card, #btnSendCustom');
      cards.forEach(el => {
        el.style.opacity = '0.5';
        el.style.pointerEvents = 'none';
      });

      let remaining = seconds;
      const notice = document.getElementById('cooldownNotice');
      if (notice) {
        notice.style.display = 'block';
        notice.textContent = `⏳ Buttons temporarily locked (${remaining}s) to prevent spamming...`;
      }

      const timer = setInterval(() => {
        remaining--;
        if (notice) {
          notice.textContent = `⏳ Buttons temporarily locked (${remaining}s) to prevent spamming...`;
        }
        if (remaining <= 0) {
          clearInterval(timer);
          if (notice) notice.style.display = 'none';
          cards.forEach(el => {
            el.style.opacity = '1';
            el.style.pointerEvents = 'auto';
          });
          isSendingAlert = false;
        }
      }, 1000);
    }

    // Audio chime for bystander when owner replies
    function playBystanderReplySound() {
      try {
        const audio = new Audio('/static/audio/chime.wav');
        audio.volume = 1.0;
        audio.play().catch(() => {
          // Fallback synthesized chime for browsers with strict media autoplay
          try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) {
              const ctx = new AudioContext();
              const now = ctx.currentTime;
              [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + i * 0.09);
                gain.gain.setValueAtTime(0.3, now + i * 0.09);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.35);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now + i * 0.09);
                osc.stop(now + i * 0.09 + 0.35);
              });
            }
          } catch (err) {}
        });
      } catch (e) {}
    }

    let lastKnownOwnerResponse = '';

    function displayOwnerResponse(msg, playSound = true) {
      const banner = document.getElementById('ownerResponseBanner');
      const textEl = document.getElementById('ownerResponseText');
      if (banner && textEl) {
        textEl.textContent = `"${msg}"`;
        banner.style.display = 'block';
        banner.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        if (playSound) {
          playBystanderReplySound();
        }
      }
    }

    // Check for prior owner response on initial load (without playing sound on stale message)
    fetch(`/api/owner/response/${tagId}`)
      .then(r => r.json())
      .then(d => {
        if (d.has_response && d.message) {
          lastKnownOwnerResponse = d.message;
          displayOwnerResponse(d.message, false);
        }
      })
      .catch(() => {});

    // Active live polling so laptop/mobile bystanders receive owner reply with sound within 1.5s
    setInterval(async () => {
      try {
        const r = await fetch(`/api/owner/response/${tagId}`);
        const d = await r.json();
        if (d.has_response && d.message && d.message !== lastKnownOwnerResponse) {
          lastKnownOwnerResponse = d.message;
          displayOwnerResponse(d.message, true);
        }
      } catch (e) {}
    }, 1500);

    let isSendingAlert = false;
    async function sendAlert(type, message, cardEl = null) {
      if (isSendingAlert) return;
      isSendingAlert = true;

      const originalHtml = cardEl ? cardEl.innerHTML : '';
      if (cardEl) {
        cardEl.style.opacity = '0.7';
        cardEl.style.pointerEvents = 'none';
        const arrow = cardEl.querySelector('.alert-arrow');
        if (arrow) arrow.textContent = '⏳';
      }

      let locationUrl = null;
      try {
        locationUrl = await getApproxLocation();
      } catch (e) {}

      try {
        const resp = await fetch(`/api/alert/${tagId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            alert_type: type,
            message: message,
            location: locationUrl || ''
          })
        });

        const data = await resp.json().catch(() => ({}));

        if (resp.ok) {
          if (data.status === 'rate_limited') {
            showToast(data.message || 'Maximum 3 alerts reached. Please wait for owner to respond.', true);
            startAlertCooldown(12);
          } else if (data.status === 'snoozed') {
            showToast(data.message || 'Owner is currently on Do Not Disturb.', false);
            startAlertCooldown(10);
          } else {
            showToast('🔔 Alert delivered directly to vehicle owner!');
            if (cardEl) {
              const arrow = cardEl.querySelector('.alert-arrow');
              if (arrow) arrow.textContent = '✅';
            }
            startAlertCooldown(10);
          }
        } else {
          showToast('Failed to deliver alert. Please try again.', true);
          isSendingAlert = false;
        }
      } catch (e) {
        showToast('Network error delivering alert.', true);
        isSendingAlert = false;
      } finally {
        if (cardEl) {
          setTimeout(() => {
            cardEl.innerHTML = originalHtml;
          }, 2000);
        }
      }
    }

    document.querySelectorAll('.alert-card').forEach(card => {
      card.addEventListener('click', () => {
        const type = card.getAttribute('data-type');
        const text = card.getAttribute('data-text');
        sendAlert(type, text, card);
      });
    });

    document.getElementById('btnSendCustom').addEventListener('click', () => {
      const msg = document.getElementById('customMessage').value.trim();
      if (!msg) {
        alert('Please enter a note for the vehicle owner.');
        return;
      }
      sendAlert('custom', msg);
      document.getElementById('customMessage').value = '';
    });

    // Voice Call Logic
    let callClient = null;
    let callTimerInterval = null;
    let callSeconds = 0;

    function startTimer() {
      callSeconds = 0;
      callDuration.style.display = 'block';
      callDuration.textContent = '00:00';
      if (callTimerInterval) clearInterval(callTimerInterval);
      callTimerInterval = setInterval(() => {
        callSeconds++;
        const mins = String(Math.floor(callSeconds / 60)).padStart(2, '0');
        const secs = String(callSeconds % 60).padStart(2, '0');
        callDuration.textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function stopTimer() {
      if (callTimerInterval) clearInterval(callTimerInterval);
      callDuration.style.display = 'none';
      callSeconds = 0;
    }

    function initCallClient() {
      callClient = new VoiceCallClient(
        tagId,
        'caller',
        (state) => {
          if (state === 'calling') {
            callOverlay.classList.add('active');
            callStatusText.textContent = 'Calling Vehicle Owner...';
            callSubText.textContent = 'Owner phone is ringing. Please wait...';
            stopTimer();
            if (window.soundManager) window.soundManager.startRingtone();
          } else if (state === 'call_accepted') {
            if (window.soundManager) window.soundManager.stopRingtone();
            callStatusText.textContent = 'Connecting Secure Audio...';
          } else if (state === 'in_call') {
            if (window.soundManager) window.soundManager.stopRingtone();
            callStatusText.textContent = 'Call Connected (Live Audio)';
            callSubText.textContent = 'Speaking privately with vehicle owner';
            startTimer();
          } else if (state === 'call_ended' || state === 'call_rejected' || state === 'idle') {
            if (window.soundManager) window.soundManager.stopRingtone();
            stopTimer();
            callOverlay.classList.remove('active');
            showToast(state === 'call_rejected' ? 'Call was declined by owner' : 'Call ended');
          }
        },
        (remoteStream) => {
          remoteAudio.srcObject = remoteStream;
          remoteAudio.play().catch(e => console.log('Audio autoplay error:', e));
        }
      );
      callClient.onOwnerResponse = (msg) => {
        displayOwnerResponse(msg.message);
      };
      callClient.connectSignaling();
    }

    // Connect signaling on load to receive instant owner responses
    initCallClient();

    document.getElementById('btnStartCall').addEventListener('click', async () => {
      await sendAlert('incoming_call', 'Incoming Voice Call Request');
      if (callClient) {
        callClient.startCall();
      }
    });

    document.getElementById('btnEndCall').addEventListener('click', () => {
      if (callClient) {
        callClient.endCall();
      }
      callOverlay.classList.remove('active');
      stopTimer();
    });
  </script>
</body>
</html>
