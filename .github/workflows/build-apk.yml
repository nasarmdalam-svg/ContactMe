name: Build ParkBuzz Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK on GitHub Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Named APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/ParkBuzz-v1.3.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParkBuzz-v1.3-APK
          path: android/app/build/outputs/apk/debug/ParkBuzz-v1.3.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3
          name: ParkBuzz Android App v1.3
          body: |
            ## ⚡ ParkBuzz v1.3
            - **Android 14+ Compatibility Fix:** Added `FOREGROUND_SERVICE_TYPE_REMOTE_MESSAGING` so the background service runs properly on Android 14/15 without crashing on launch.
            - **Native Dual-Tone Horn Chime:** Synthesizes the exact car horn chime (850Hz & 1100Hz) natively via AudioTrack so it plays even when the app is completely closed.
            - **Screen Pop-Up:** Pops up directly on top of the lock screen and active screen on alert.
          files: |
            android/app/build/outputs/apk/debug/ParkBuzz-v1.3.apk
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
