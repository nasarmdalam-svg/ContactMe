<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activate Your Sticker - ParkingBuzz</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="manifest" href="/static/manifest.json">
</head>
<body>
  <div class="container">
    <!-- Top Action Bar with Back Button -->
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;">
      <button type="button" id="btnGoBack" onclick="const t = localStorage.getItem('pb_active_tag') || localStorage.getItem('last_active_tag'); if (t) { window.location.href = '/owner/' + t; } else if (history.length > 1) { history.back(); } else { window.location.href = '/'; }" style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #cbd5e1; border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">
        ← Back
      </button>
      <span style="font-size: 11px; color: #64748b; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;">PARKINGBUZZ</span>
    </div>

    <div class="header" style="margin-bottom: 14px;">
      <img src="/static/images/official_chrome_p_badge.png" alt="ParkingBuzz" style="width: 64px; height: 64px; border-radius: 50%; object-fit: contain; filter: drop-shadow(0 4px 16px rgba(56, 189, 248, 0.45)); margin-bottom: 8px;">
      <h1 style="font-size: 20px; font-weight: 800; margin-bottom: 3px;">Activate New Sticker</h1>
      <p style="font-size: 13px; color: var(--text-secondary); margin: 0;">Sticker ID: <strong style="color: #38bdf8;">{{ tag_id }}</strong></p>
    </div>

    <div class="privacy-banner" style="padding: 8px 12px; margin-bottom: 14px; gap: 8px;">
      <span style="font-size: 16px;">🛡️</span>
      <span style="font-size: 12px; line-height: 1.35;">Link this sticker to your phone to receive instant sound alerts and masked calls.</span>
    </div>

    <form id="activateForm">
      <div style="margin-bottom: 16px;">
        <label style="display:block; font-size: 14px; margin-bottom: 6px; color: var(--text-secondary);">
          Vehicle Name or Plate (for your reference)
        </label>
        <input type="text" id="vehicleName" placeholder="e.g. Blue Civic (ABC-1234)" required>
      </div>

      <div style="margin-bottom: 20px; display: flex; align-items: flex-start; gap: 10px; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);">
        <input type="checkbox" id="agreePrivacy" required style="margin-top: 3px; cursor: pointer; width: 18px; height: 18px; accent-color: #38bdf8;">
        <label for="agreePrivacy" style="font-size: 13px; color: var(--text-secondary); cursor: pointer; line-height: 1.4;">
          I have read and agree to the <a href="/privacy" target="_blank" style="color: #38bdf8; text-decoration: underline; font-weight: 600;">ParkingBuzz Privacy Policy</a> and terms of service.
        </label>
      </div>

      <button type="submit" class="btn-primary" style="background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); color: #080c14; font-weight: 800; border: none; box-shadow: 0 4px 18px rgba(56, 189, 248, 0.35);">
        🚀 Activate Sticker & Open Dashboard
      </button>

    </form>

    <div id="statusToast" style="display:none; margin-top: 15px; padding: 12px; border-radius: 8px; text-align: center; font-size: 14px;"></div>
  </div>

  <script>
    const tagId = "{{ tag_id }}";
    const form = document.getElementById('activateForm');
    const toast = document.getElementById('statusToast');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const vehicleName = document.getElementById('vehicleName').value.trim();
      const customNote = '';

      try {
        const resp = await fetch(`/api/activate/${tagId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ vehicle_name: vehicleName, custom_note: customNote })
        });
        const data = await resp.json();
        if (resp.ok) {
          toast.textContent = 'Activated! Redirecting to your dashboard...';
          toast.style.display = 'block';
          toast.style.background = 'rgba(16, 185, 129, 0.2)';
          toast.style.color = '#34d399';
          setTimeout(() => {
            window.location.href = `/owner/${tagId}?token=${data.owner_token}`;
          }, 1000);
        } else {
          toast.textContent = data.detail || 'Activation failed';
          toast.style.display = 'block';
          toast.style.background = 'rgba(239, 68, 68, 0.2)';
          toast.style.color = '#f87171';
        }
      } catch (err) {
        alert('Error connecting to server: ' + err.message);
      }
    });
  </script>
</body>
</html>
