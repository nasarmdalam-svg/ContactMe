name: Keep ParkBuzz Server Alive 24/7

on:
  schedule:
    # Run every 10 minutes every day to prevent Render free instance from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Server to Prevent Sleep
    runs-on: ubuntu-latest
    steps:
      - name: Ping Server
        run: |
          echo "Pinging ParkBuzz server to maintain 24/7 active status..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://contactme-go9v.onrender.com/)
          echo "Response code: $STATUS"
