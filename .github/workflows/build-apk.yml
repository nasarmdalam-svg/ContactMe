name: Build ParkBuzz Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK on GitHub Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Named APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/ParkBuzz-v1.6.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParkBuzz-v1.6-APK
          path: android/app/build/outputs/apk/debug/ParkBuzz-v1.6.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.6
          name: ParkBuzz Android App v1.6
          body: |
            ## ⚡ ParkBuzz v1.6
            - **Silent Background (No Status Bar Icon):** Set keeper notification channel to MIN priority so ParkBuzz sits silently in the background with zero icons on the top notification bar.
            - **Removed Battery Saver & Setup Popups:** Opens instantly and cleanly without throwing battery saver dialogs or onboarding cards.
            - **Eliminated Bizarre Synth Sound:** Removed harsh sawtooth Web Audio synth completely. Only the clean car chime (tit-tit-tit) plays.
            - **Seamless 1-Tap Upgrade:** Signed with the permanent keystore so users update directly without uninstalling.
          files: |
            android/app/build/outputs/apk/debug/ParkBuzz-v1.6.apk
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
